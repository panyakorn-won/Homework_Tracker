<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>MCR Demo</title>
    <meta name="description" content="Homework Tracker - Intelligent Academic Tracker & Planner">
    
    <meta property="og:type" content="website">
    <meta property="og:title" content="MCR Demo">
    <meta property="og:description" content="Homework Tracker - Intelligent Academic Tracker & Planner">
    <meta property="og:url" content="https://panyakorn-won.github.io/Homework_Tracker/">
    <meta property="og:image" content="https://panyakorn-won.github.io/Homework_Tracker/icon-512.png">
    
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="shortcut icon" href="icon-192.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#030712">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #030712;
            color: #f3f4f6;
            min-height: 100vh;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        /* Header & Logo */
        .header {
            margin-bottom: 24px;
        }

        .brand-title {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 6px;
        }

        .app-logo {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            object-fit: cover;
            background-color: #1e293b;
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 14px;
            color: #94a3b8;
            font-weight: 400;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 24px;
        }

        .stat-card {
            background-color: #0b1329;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 14px 8px;
            text-align: center;
        }

        .stat-number {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 11px;
            color: #64748b;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Form Card */
        .card {
            background-color: #0b1329;
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 15px;
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        input[type="text"], input[type="date"] {
            width: 100%;
            padding: 12px 14px;
            background-color: #030712;
            border: 1px solid #1e293b;
            border-radius: 10px;
            color: #f3f4f6;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #3b82f6;
        }

        .date-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background-color: #3b82f6;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 6px;
            transition: background-color 0.2s;
        }

        .btn-primary:active {
            background-color: #2563eb;
        }

        /* Search & Filters */
        .search-box {
            position: relative;
            margin-bottom: 14px;
        }

        .search-box input {
            padding-left: 38px;
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
        }

        .filter-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            margin-bottom: 16px;
            padding-bottom: 4px;
        }

        .tab {
            padding: 8px 16px;
            border-radius: 20px;
            background-color: #0b1329;
            border: 1px solid #1e293b;
            color: #94a3b8;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab.active {
            background-color: #3b82f6;
            color: #ffffff;
            border-color: #3b82f6;
        }

        /* Task List Container */
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .task-item {
            background-color: #0b1329;
            border: 1px solid #1e293b;
            border-radius: 14px;
            padding: 16px;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            transition: all 0.2s;
        }

        .task-item.completed {
            opacity: 0.6;
            border-color: #10b98133;
            background-color: #064e3b11;
        }

        .task-item.overdue {
            border-color: #ef444466;
        }

        .task-info {
            flex: 1;
        }

        .task-title {
            font-size: 16px;
            font-weight: 600;
            color: #f3f4f6;
            margin-bottom: 6px;
            word-break: break-word;
        }

        .task-item.completed .task-title {
            text-decoration: line-through;
            color: #9ca3af;
        }

        .task-dates {
            font-size: 12px;
            color: #64748b;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .task-actions {
            display: flex;
            gap: 8px;
        }

        .btn-action {
            background: none;
            border: 1px solid #1e293b;
            color: #94a3b8;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-check {
            border-color: #10b98155;
            color: #10b981;
        }

        .btn-check:hover {
            background-color: #10b98122;
        }

        .btn-delete {
            border-color: #ef444455;
            color: #ef4444;
        }

        .btn-delete:hover {
            background-color: #ef444422;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #64748b;
        }

        .empty-icon {
            font-size: 32px;
            margin-bottom: 8px;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="brand-title">
                <img src="icon-192.png" alt="Logo" class="app-logo" onerror="this.style.display='none'">
                <h1>Homework Tracker</h1>
            </div>
            <p class="subtitle">Intelligent Academic Tracker & Planner</p>
        </header>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="total-count">0</div>
                <div class="stat-label">Total Tasks</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="pending-count">0</div>
                <div class="stat-label">Pending</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="completed-count">0</div>
                <div class="stat-label">Completed</div>
            </div>
        </div>

        <!-- Form -->
        <div class="card">
            <div class="card-title">+ Create New Task</div>
            <form id="task-form">
                <div class="form-group">
                    <label>Task Title / Subject</label>
                    <input type="text" id="task-input" placeholder="e.g. Physics Ch. 5 Problems" required>
                </div>
                <div class="date-row">
                    <div class="form-group">
                        <label>Assigned Date</label>
                        <input type="date" id="assigned-date">
                    </div>
                    <div class="form-group">
                        <label>Due Date</label>
                        <input type="date" id="due-date">
                    </div>
                </div>
                <button type="submit" class="btn-primary">Save Task</button>
            </form>
        </div>

        <!-- Search & Filters -->
        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="search-input" placeholder="Search tasks...">
        </div>

        <div class="filter-tabs">
            <button class="tab active" data-filter="all">All</button>
            <button class="tab" data-filter="pending">Pending</button>
            <button class="tab" data-filter="completed">Completed</button>
            <button class="tab" data-filter="overdue">Overdue</button>
        </div>

        <!-- Task List Area -->
        <div id="task-list" class="task-list"></div>

        <!-- Empty State -->
        <div id="empty-state" class="empty-state">
            <div class="empty-icon">⚙️</div>
            <p>No tasks found. Add a new task above!</p>
        </div>
    </div>

    <script>
        // โหลดข้อมูลการบ้านจาก LocalStorage
        let tasks = JSON.parse(localStorage.getItem('mcr_tasks')) || [];
        let currentFilter = 'all';
        let searchQuery = '';

        const taskForm = document.getElementById('task-form');
        const taskInput = document.getElementById('task-input');
        const assignedDateInput = document.getElementById('assigned-date');
        const dueDateInput = document.getElementById('due-date');
        const searchInput = document.getElementById('search-input');
        const filterTabs = document.querySelectorAll('.tab');
        const taskList = document.getElementById('task-list');
        const emptyState = document.getElementById('empty-state');

        // ฟังก์ชัน บันทึก และ อัปเดตหน้าจอ
        function saveAndRender() {
            localStorage.setItem('mcr_tasks', JSON.stringify(tasks));
            renderTasks();
        }

        // ฟังก์ชัน แสดงผลการบ้าน
        function renderTasks() {
            // 1. คำนวณและอัปเดตตัวเลข Stats จากข้อมูลจริงทั้งหมด
            const total = tasks.length;
            const completedCount = tasks.filter(t => t.completed).length;
            const pendingCount = total - completedCount;

            document.getElementById('total-count').textContent = total;
            document.getElementById('pending-count').textContent = pendingCount;
            document.getElementById('completed-count').textContent = completedCount;

            // วันที่ปัจจุบัน (รูปแบบ YYYY-MM-DD) สำหรับเช็ก Overdue
            const todayStr = new Date().toISOString().split('T')[0];

            // 2. กรองข้อมูลตาม Filter (All / Pending / Completed / Overdue)
            let filteredTasks = tasks.filter(task => {
                if (currentFilter === 'pending') return !task.completed;
                if (currentFilter === 'completed') return task.completed;
                if (currentFilter === 'overdue') {
                    return !task.completed && task.dueDate && task.dueDate < todayStr;
                }
                return true; // 'all'
            });

            // 3. กรองข้อมูลตามช่องค้นหา Search
            if (searchQuery.trim() !== '') {
                const q = searchQuery.toLowerCase().trim();
                filteredTasks = filteredTasks.filter(task => task.title.toLowerCase().includes(q));
            }

            // 4. แสดงผลลงในหน้าเว็บ
            taskList.innerHTML = '';

            if (filteredTasks.length === 0) {
                emptyState.style.display = 'block';
            } else {
                emptyState.style.display = 'none';

                filteredTasks.forEach((task) => {
                    const isOverdue = !task.completed && task.dueDate && task.dueDate < todayStr;
                    
                    const taskCard = document.createElement('div');
                    taskCard.className = `task-item ${task.completed ? 'completed' : ''} ${isOverdue ? 'overdue' : ''}`;

                    const assignedText = task.assignedDate ? `สั่ง: ${task.assignedDate}` : '';
                    const dueText = task.dueDate ? `ส่ง: ${task.dueDate}` : '';

                    taskCard.innerHTML = `
                        <div class="task-info">
                            <div class="task-title">${escapeHtml(task.title)}</div>
                            <div class="task-dates">
                                ${assignedText ? `<span>📅 ${assignedText}</span>` : ''}
                                ${dueText ? `<span style="color: ${isOverdue ? '#ef4444' : '#38bdf8'}; font-weight: ${isOverdue ? 'bold' : 'normal'};">⏰ ${dueText} ${isOverdue ? '(เลยกำหนด)' : ''}</span>` : ''}
                            </div>
                        </div>
                        <div class="task-actions">
                            <button class="btn-action btn-check" onclick="toggleTask(${task.id})" title="${task.completed ? 'ย้ายกลับไปค้างส่ง' : 'ทำเสร็จแล้ว'}">
                                ${task.completed ? '↩️' : '✓'}
                            </button>
                            <button class="btn-action btn-delete" onclick="deleteTask(${task.id})" title="ลบรายการ">
                                🗑️
                            </button>
                        </div>
                    `;

                    taskList.appendChild(taskCard);
                });
            }
        }

        // เพิ่มการบ้านใหม่
        taskForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const newTask = {
                id: Date.now(),
                title: taskInput.value.trim(),
                assignedDate: assignedDateInput.value,
                dueDate: dueDateInput.value,
                completed: false
            };

            tasks.unshift(newTask); // รายการใหม่อยู่บนสุด
            saveAndRender();

            // เคลียร์ค่าในช่องป้อน
            taskInput.value = '';
            assignedDateInput.value = '';
            dueDateInput.value = '';
        });

        // ค้นหาการบ้านเมื่อพิมพ์ในช่อง Search
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderTasks();
        });

        // เปลี่ยนแท็บตัวกรอง (All / Pending / Completed / Overdue)
        filterTabs.forEach(tab => {
            tab.addEventListener('click', () => {
                filterTabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentFilter = tab.getAttribute('data-filter');
                renderTasks();
            });
        });

        // สลับสถานะ ทำเสร็จแล้ว / ค้างอยู่
        window.toggleTask = function(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                saveAndRender();
            }
        };

        // ลบการบ้าน
        window.deleteTask = function(id) {
            if (confirm('คุณต้องการลบรายการการบ้านนี้ใช่หรือไม่?')) {
                tasks = tasks.filter(t => t.id !== id);
                saveAndRender();
            }
        };

        // ฟังก์ชันป้องกันข้อความตัวอักษรพิเศษ
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // แสดงผลครั้งแรก
        renderTasks();

        // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .catch(err => console.log('SW registration failed: ', err));
            });
        }
    </script>
</body>
</html>
