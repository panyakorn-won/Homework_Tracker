<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>Homework Tracker</title>
    <meta name="theme-color" content="#030712">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #030712; color: #f3f4f6; min-height: 100vh; padding: 20px 16px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 480px; }
        .header { margin-bottom: 20px; display: flex; justify-content: space-between; align-items: flex-start; }
        .brand-title { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
        .app-logo { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; background-color: #1e293b; }
        h1 { font-size: 26px; font-weight: 800; color: #ffffff; letter-spacing: -0.5px; }
        .subtitle { font-size: 13px; color: #94a3b8; font-weight: 400; }
        .cloud-status { font-size: 12px; color: #38bdf8; background: #0b1329; border: 1px solid #1e293b; padding: 6px 12px; border-radius: 20px; display: inline-flex; align-items: center; gap: 6px; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .stat-card { background-color: #0b1329; border: 1px solid #1e293b; border-radius: 12px; padding: 14px 8px; text-align: center; }
        .stat-number { font-size: 22px; font-weight: 700; color: #ffffff; margin-bottom: 4px; }
        .stat-label { font-size: 11px; color: #64748b; font-weight: 600; text-transform: uppercase; }
        .card { background-color: #0b1329; border: 1px solid #1e293b; border-radius: 16px; padding: 20px; margin-bottom: 20px; }
        .card-title { font-size: 15px; font-weight: 700; color: #38bdf8; margin-bottom: 16px; }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; margin-bottom: 6px; }
        input[type="text"], input[type="date"], input[type="datetime-local"], textarea, select { width: 100%; padding: 12px 10px; background-color: #030712; border: 1px solid #1e293b; border-radius: 10px; color: #f3f4f6; font-size: 13px; outline: none; }
        input[type="date"], input[type="datetime-local"] { color-scheme: dark; }
        .date-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-primary { width: 100%; padding: 14px; background-color: #3b82f6; color: #ffffff; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; }
        .controls-row { display: flex; gap: 10px; margin-bottom: 12px; }
        .search-box { position: relative; flex: 1; }
        .search-box input { padding-left: 36px; }
        .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #64748b; }
        .sort-select-wrapper select { cursor: pointer; }
        .filter-tabs { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 16px; padding-bottom: 4px; }
        .tab { padding: 8px 16px; border-radius: 20px; background-color: #0b1329; border: 1px solid #1e293b; color: #94a3b8; font-size: 13px; font-weight: 600; cursor: pointer; }
        .tab.active { background-color: #3b82f6; color: #ffffff; border-color: #3b82f6; }
        .task-list { display: flex; flex-direction: column; gap: 12px; }
        .task-item { background-color: #0b1329; border: 1px solid #1e293b; border-radius: 14px; padding: 16px; display: flex; justify-content: space-between; gap: 12px; }
        .task-item.completed { opacity: 0.75; border-color: #10b98144; background-color: #064e3b15; }
        .task-item.overdue { border-color: #ef444466; }
        .task-info { flex: 1; min-width: 0; }
        .task-title { font-size: 16px; font-weight: 600; color: #f3f4f6; }
        .task-item.completed .task-title { text-decoration: line-through; color: #9ca3af; }
        .task-note { font-size: 13px; color: #cbd5e1; background-color: #030712aa; padding: 8px 12px; border-radius: 8px; border-left: 3px solid #38bdf8; margin: 6px 0; }
        .status-badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 12px; text-transform: uppercase; }
        .badge-pending { background-color: #0284c722; color: #38bdf8; }
        .badge-completed { background-color: #10b98122; color: #34d399; }
        .task-dates { font-size: 12px; color: #64748b; display: flex; gap: 10px; }
        .task-actions { display: flex; gap: 8px; }
        .btn-action { background: none; border: 1px solid #1e293b; color: #94a3b8; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
        .empty-state { text-align: center; padding: 40px 20px; color: #64748b; }
    </style>
</head>
<body>

    <div class="container">
        <header class="header">
            <div>
                <div class="brand-title">
                    <img src="icon-192.png" alt="Logo" class="app-logo" onerror="this.style.display='none'">
                    <h1>Homework Tracker</h1>
                </div>
                <p class="subtitle">Google Sheets Sync Enabled</p>
            </div>
            <div id="cloud-status" class="cloud-status">☁️ Syncing...</div>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="total-count">0</div>
                <div class="stat-label">Total Tasks</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="pending-count">0</div>
                <div class="stat-label">Pending</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="completed-count">0</div>
                <div class="stat-label">Completed</div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">+ Create New Task</div>
            <form id="task-form">
                <div class="form-group">
                    <label>Task Title / Subject</label>
                    <input type="text" id="task-input" placeholder="e.g. Math Homework" required>
                </div>
                <div class="form-group">
                    <label>Notes / Details (Optional)</label>
                    <textarea id="task-note" rows="2" placeholder="e.g. Page 42 Ex. 1-10"></textarea>
                </div>
                <div class="date-row">
                    <div class="form-group">
                        <label>Assigned Date</label>
                        <input type="date" id="assigned-date">
                    </div>
                    <div class="form-group">
                        <label>Due Date & Time</label>
                        <input type="datetime-local" id="due-date">
                    </div>
                </div>
                <button type="submit" class="btn-primary">Save Task</button>
            </form>
        </div>

        <div class="controls-row">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="search-input" placeholder="Search tasks...">
            </div>
            <div class="sort-select-wrapper">
                <select id="sort-select">
                    <option value="dueDate">⏰ Due Date</option>
                    <option value="assignedDate">📅 Assigned Date</option>
                    <option value="newest">🆕 Newest</option>
                </select>
            </div>
        </div>

        <div class="filter-tabs">
            <button class="tab active" data-filter="all">All</button>
            <button class="tab" data-filter="pending">Pending</button>
            <button class="tab" data-filter="completed">Completed</button>
            <button class="tab" data-filter="overdue">Overdue</button>
        </div>

        <div id="task-list" class="task-list"></div>
        <div id="empty-state" class="empty-state">
            <div style="font-size:32px;margin-bottom:8px;">⚙️</div>
            <p>No tasks found.</p>
        </div>
    </div>

    <script>
        // ⚠️ วาง Web App URL ที่ได้จากขั้นตอนที่ 3 ตรงนี้
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxYQXocEv4NOvd8wIzghSctVxklFz4AJ22RicWaFfyed4dn15_mMEF19IJHEO09780b/exec";

        let tasks = JSON.parse(localStorage.getItem('mcr_tasks')) || [];
        let currentFilter = 'all';
        let searchQuery = '';
        let currentSort = 'dueDate';

        const cloudStatus = document.getElementById('cloud-status');

        function updateCloudStatus(status) {
            if (status === 'syncing') cloudStatus.innerHTML = '🔄 Syncing...';
            else if (status === 'online') cloudStatus.innerHTML = '☁️ Synced to Sheets';
            else if (status === 'error') cloudStatus.innerHTML = '⚠️ Offline Mode';
        }

        async function fetchFromSheets() {
            if (!SCRIPT_URL || SCRIPT_URL.includes("YOUR_GOOGLE_APPS_SCRIPT_URL_HERE")) {
                updateCloudStatus('error');
                return;
            }
            updateCloudStatus('syncing');
            try {
                const res = await fetch(SCRIPT_URL);
                const data = await res.json();
                if (Array.isArray(data)) {
                    tasks = data;
                    localStorage.setItem('mcr_tasks', JSON.stringify(tasks));
                    updateCloudStatus('online');
                    renderTasks();
                }
            } catch (err) {
                console.error(err);
                updateCloudStatus('error');
            }
        }

        async function syncToSheets() {
            localStorage.setItem('mcr_tasks', JSON.stringify(tasks));
            renderTasks();

            if (!SCRIPT_URL || SCRIPT_URL.includes("YOUR_GOOGLE_APPS_SCRIPT_URL_HERE")) return;
            
            updateCloudStatus('syncing');
            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: "syncAll", tasks: tasks })
                });
                updateCloudStatus('online');
            } catch (err) {
                console.error(err);
                updateCloudStatus('error');
            }
        }

        function renderTasks() {
            document.getElementById('total-count').textContent = tasks.length;
            document.getElementById('pending-count').textContent = tasks.filter(t => !t.completed).length;
            document.getElementById('completed-count').textContent = tasks.filter(t => t.completed).length;

            const nowIso = new Date().toISOString().slice(0, 16);

            let filteredTasks = tasks.filter(task => {
                if (currentFilter === 'pending') return !task.completed;
                if (currentFilter === 'completed') return task.completed;
                if (currentFilter === 'overdue') return !task.completed && task.dueDate && task.dueDate < nowIso;
                return true;
            });

            if (searchQuery.trim() !== '') {
                const q = searchQuery.toLowerCase().trim();
                filteredTasks = filteredTasks.filter(task => 
                    task.title.toLowerCase().includes(q) || (task.note && task.note.toLowerCase().includes(q))
                );
            }

            filteredTasks.sort((a, b) => {
                if (currentSort === 'dueDate') return (a.dueDate || '').localeCompare(b.dueDate || '');
                if (currentSort === 'assignedDate') return (b.assignedDate || '').localeCompare(a.assignedDate || '');
                return b.id - a.id;
            });

            const taskList = document.getElementById('task-list');
            const emptyState = document.getElementById('empty-state');
            taskList.innerHTML = '';

            if (filteredTasks.length === 0) {
                emptyState.style.display = 'block';
            } else {
                emptyState.style.display = 'none';
                filteredTasks.forEach(task => {
                    const isOverdue = !task.completed && task.dueDate && task.dueDate < nowIso;
                    const item = document.createElement('div');
                    item.className = `task-item ${task.completed ? 'completed' : ''} ${isOverdue ? 'overdue' : ''}`;
                    item.innerHTML = `
                        <div class="task-info">
                            <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
                                <div class="task-title">${escapeHtml(task.title)}</div>
                                <span class="status-badge ${task.completed ? 'badge-completed' : 'badge-pending'}">
                                    ${task.completed ? '✅ Completed' : '⏳ Pending'}
                                </span>
                            </div>
                            ${task.note ? `<div class="task-note">📝 ${escapeHtml(task.note)}</div>` : ''}
                            <div class="task-dates">
                                ${task.assignedDate ? `<span>📅 Assigned: ${task.assignedDate}</span>` : ''}
                                ${task.dueDate ? `<span style="color:${isOverdue ? '#ef4444' : '#38bdf8'};">⏰ Due: ${task.dueDate.replace('T', ' ')} ${isOverdue ? '(Overdue)' : ''}</span>` : ''}
                            </div>
                        </div>
                        <div class="task-actions">
                            <button class="btn-action" onclick="toggleTask(${task.id})">${task.completed ? '↩️' : '✓'}</button>
                            <button class="btn-action" onclick="deleteTask(${task.id})">🗑️</button>
                        </div>
                    `;
                    taskList.appendChild(item);
                });
            }
        }

        document.getElementById('task-form').addEventListener('submit', (e) => {
            e.preventDefault();
            tasks.unshift({
                id: Date.now(),
                title: document.getElementById('task-input').value.trim(),
                note: document.getElementById('task-note').value.trim(),
                assignedDate: document.getElementById('assigned-date').value,
                dueDate: document.getElementById('due-date').value,
                completed: false
            });
            syncToSheets();
            document.getElementById('task-input').value = '';
            document.getElementById('task-note').value = '';
            document.getElementById('assigned-date').value = '';
            document.getElementById('due-date').value = '';
        });

        document.getElementById('search-input').addEventListener('input', (e) => { searchQuery = e.target.value; renderTasks(); });
        document.getElementById('sort-select').addEventListener('change', (e) => { currentSort = e.target.value; renderTasks(); });
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentFilter = tab.getAttribute('data-filter');
                renderTasks();
            });
        });

        window.toggleTask = function(id) {
            const task = tasks.find(t => t.id === id);
            if (task) { task.completed = !task.completed; syncToSheets(); }
        };

        window.deleteTask = function(id) {
            if (confirm('Delete this task?')) { tasks = tasks.filter(t => t.id !== id); syncToSheets(); }
        };

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        renderTasks();
        fetchFromSheets();
    </script>
</body>
</html>
