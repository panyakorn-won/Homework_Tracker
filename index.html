<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>MCR Demo</title>
    <meta name="description" content="Homework Tracker - Intelligent Academic Tracker & Planner">
    
    <meta property="og:type" content="website">
    <meta property="og:title" content="MCR Demo">
    <meta property="og:description" content="Homework Tracker - Intelligent Academic Tracker & Planner">
    <meta property="og:url" content="https://panyakorn-won.github.io/Homework_Tracker/">
    <meta property="og:image" content="https://panyakorn-won.github.io/Homework_Tracker/icon-512.png">
    
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="shortcut icon" href="icon-192.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#030712">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #030712;
            color: #f3f4f6;
            min-height: 100vh;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        /* Header & Logo */
        .header {
            margin-bottom: 24px;
        }

        .brand-title {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 6px;
        }

        .app-logo {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            object-fit: cover;
            background-color: #1e293b;
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 14px;
            color: #94a3b8;
            font-weight: 400;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 24px;
        }

        .stat-card {
            background-color: #0b1329;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 14px 8px;
            text-align: center;
        }

        .stat-number {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 11px;
            color: #64748b;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Form Card */
        .card {
            background-color: #0b1329;
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 15px;
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        input[type="text"], input[type="date"] {
            width: 100%;
            padding: 12px 14px;
            background-color: #030712;
            border: 1px solid #1e293b;
            border-radius: 10px;
            color: #f3f4f6;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #3b82f6;
        }

        .date-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background-color: #3b82f6;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 6px;
            transition: background-color 0.2s;
        }

        .btn-primary:active {
            background-color: #2563eb;
        }

        /* Task List Container */
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 16px;
        }

        .task-item {
            background-color: #0b1329;
            border: 1px solid #1e293b;
            border-radius: 14px;
            padding: 16px;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            transition: all 0.2s;
        }

        .task-item.completed {
            opacity: 0.6;
            border-color: #10b98133;
            background-color: #064e3b11;
        }

        .task-info {
            flex: 1;
        }

        .task-title {
            font-size: 16px;
            font-weight: 600;
            color: #f3f4f6;
            margin-bottom: 6px;
            word-break: break-word;
        }

        .task-item.completed .task-title {
            text-decoration: line-through;
            color: #9ca3af;
        }

        .task-dates {
            font-size: 12px;
            color: #64748b;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .task-actions {
            display: flex;
            gap: 8px;
        }

        .btn-action {
            background: none;
            border: 1px solid #1e293b;
            color: #94a3b8;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-check {
            border-color: #10b98155;
            color: #10b981;
        }

        .btn-check:hover {
            background-color: #10b98122;
        }

        .btn-delete {
            border-color: #ef444455;
            color: #ef4444;
        }

        .btn-delete:hover {
            background-color: #ef444422;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #64748b;
        }

        .empty-icon {
            font-size: 32px;
            margin-bottom: 8px;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="brand-title">
                <img src="icon-192.png" alt="Logo" class="app-logo" onerror="this.style.display='none'">
                <h1>Homework Tracker</h1>
            </div>
            <p class="subtitle">Intelligent Academic Tracker & Planner</p>
        </header>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="total-count">0</div>
                <div class="stat-label">Total Tasks</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="pending-count">0</div>
                <div class="stat-label">Pending</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="completed-count">0</div>
                <div class="stat-label">Completed</div>
            </div>
        </div>

        <!-- Form -->
        <div class="card">
            <div class="card-title">+ Create New Task</div>
            <form id="task-form">
                <div class="form-group">
                    <label>Task Title / Subject</label>
                    <input type="text" id="task-input" placeholder="e.g. Physics Ch. 5 Problems" required>
                </div>
                <div class="date-row">
                    <div class="form-group">
                        <label>Assigned Date</label>
                        <input type="date" id="assigned-date">
                    </div>
                    <div class="form-group">
                        <label>Due Date</label>
                        <input type="date" id="due-date">
                    </div>
                </div>
                <button type="submit" class="btn-primary">Save Task</button>
            </form>
        </div>

        <!-- Task List Area -->
        <div id="task-list" class="task-list"></div>

        <!-- Empty State (จะซ่อนอัตโนมัติเมื่อมีรายการการบ้าน) -->
        <div id="empty-state" class="empty-state">
            <div class="empty-icon">⚙️</div>
            <p>No tasks found. Add a new task above!</p>
        </div>
    </div>

    <script>
        // โหลดข้อมูลการบ้านจาก LocalStorage
        let tasks = JSON.parse(localStorage.getItem('mcr_tasks')) || [];

        const taskForm = document.getElementById('task-form');
        const taskInput = document.getElementById('task-input');
        const assignedDateInput = document.getElementById('assigned-date');
        const dueDateInput = document.getElementById('due-date');
        const taskList = document.getElementById('task-list');
        const emptyState = document.getElementById('empty-state');

        // ฟังก์ชัน บันทึก และ อัปเดตการแสดงผล
        function saveAndRender() {
            localStorage.setItem('mcr_tasks', JSON.stringify(tasks));
            renderTasks();
        }

        // ฟังก์ชัน วาดตารางการบ้านบนหน้าจอ
        function renderTasks() {
            taskList.innerHTML = '';

            // อัปเดตตัวเลข Stats
            const total = tasks.length;
            const completed = tasks.filter(t => t.completed).length;
            const pending = total - completed;

            document.getElementById('total-count').textContent = total;
            document.getElementById('pending-count').textContent = pending;
            document.getElementById('completed-count').textContent = completed;

            // แสดง/ซ่อน Empty State
            if (tasks.length === 0) {
                emptyState.style.display = 'block';
            } else {
                emptyState.style.display = 'none';
            }

            // แสดงรายการการบ้านแต่ละรายการ
            tasks.forEach((task, index) => {
                const taskCard = document.createElement('div');
                taskCard.className = `task-item ${task.completed ? 'completed' : ''}`;

                const assignedText = task.assignedDate ? `สั่ง: ${task.assignedDate}` : '';
                const dueText = task.dueDate ? `ส่ง: ${task.dueDate}` : '';

                taskCard.innerHTML = `
                    <div class="task-info">
                        <div class="task-title">${escapeHtml(task.title)}</div>
                        <div class="task-dates">
                            ${assignedText ? `<span>📅 ${assignedText}</span>` : ''}
                            ${dueText ? `<span style="color: #38bdf8;">⏰ ${dueText}</span>` : ''}
                        </div>
                    </div>
                    <div class="task-actions">
                        <button class="btn-action btn-check" onclick="toggleTask(${index})" title="ทำเสร็จแล้ว">
                            ${task.completed ? '↩️' : '✓'}
                        </button>
                        <button class="btn-action btn-delete" onclick="deleteTask(${index})" title="ลบรายการ">
                            🗑️
                        </button>
                    </div>
                `;

                taskList.appendChild(taskCard);
            });
        }

        // เพิ่มการบ้านใหม่
        taskForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const newTask = {
                title: taskInput.value.trim(),
                assignedDate: assignedDateInput.value,
                dueDate: dueDateInput.value,
                completed: false,
                id: Date.now()
            };

            tasks.unshift(newTask); // เพิ่มรายการใหม่ไว้บนสุด
            saveAndRender();

            // เคลียร์ค่าในช่องป้อนข้อมูล
            taskInput.value = '';
            assignedDateInput.value = '';
            dueDateInput.value = '';
        });

        // สลับสถานะ ทำเสร็จแล้ว / ยังไม่เสร็จ
        window.toggleTask = function(index) {
            tasks[index].completed = !tasks[index].completed;
            saveAndRender();
        };

        // ลบรายการการบ้าน
        window.deleteTask = function(index) {
            if (confirm('คุณต้องการลบรายการการบ้านนี้ใช่หรือไม่?')) {
                tasks.splice(index, 1);
                saveAndRender();
            }
        };

        // ฟังก์ชันป้องกันตัวอักษรแปลกปลอม (Security)
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // แสดงผลครั้งแรกเมื่อเปิดหน้าเว็บ
        renderTasks();

        // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .catch(err => console.log('SW registration failed: ', err));
            });
        }
    </script>
</body>
</html>
