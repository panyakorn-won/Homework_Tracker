<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- ข้อความพรีวิวเวลาส่งลิงก์ -->
    <title>MCR Demo</title>
    <meta name="description" content="Homework Tracker - Intelligent Academic Tracker & Planner">
    
    <!-- Open Graph สำหรับ LINE / Facebook / แอปแชท -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="MCR Demo">
    <meta property="og:description" content="Homework Tracker - Intelligent Academic Tracker & Planner">
    <meta property="og:url" content="https://panyakorn-won.github.io/Homework_Tracker/">
    <!-- ⚠️ ลิงก์รูปภาพแบบเต็มสำหรับพรีวิว -->
    <meta property="og:image" content="https://panyakorn-won.github.io/Homework_Tracker/icon-512.png">
    
    <!-- ไอคอนบน iPhone และเว็บ -->
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="shortcut icon" href="icon-192.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#030712">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #030712;
            color: #f3f4f6;
            min-height: 100vh;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        /* Header & Logo */
        .header {
            margin-bottom: 24px;
        }

        .brand-title {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 6px;
        }

        .app-logo {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            object-fit: cover;
            background-color: #1e293b;
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 14px;
            color: #94a3b8;
            font-weight: 400;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 24px;
        }

        .stat-card {
            background-color: #0b1329;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 14px 8px;
            text-align: center;
        }

        .stat-number {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 11px;
            color: #64748b;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Form Card */
        .card {
            background-color: #0b1329;
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 15px;
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        input[type="text"], input[type="date"] {
            width: 100%;
            padding: 12px 14px;
            background-color: #030712;
            border: 1px solid #1e293b;
            border-radius: 10px;
            color: #f3f4f6;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #3b82f6;
        }

        .date-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background-color: #3b82f6;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 6px;
            transition: background-color 0.2s;
        }

        .btn-primary:active {
            background-color: #2563eb;
        }

        /* Search & Filters */
        .search-box {
            position: relative;
            margin-bottom: 14px;
        }

        .search-box input {
            padding-left: 38px;
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
        }

        .filter-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            margin-bottom: 20px;
            padding-bottom: 4px;
        }

        .tab {
            padding: 8px 16px;
            border-radius: 20px;
            background-color: #0b1329;
            border: 1px solid #1e293b;
            color: #94a3b8;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
        }

        .tab.active {
            background-color: #3b82f6;
            color: #ffffff;
            border-color: #3b82f6;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #64748b;
        }

        .empty-icon {
            font-size: 32px;
            margin-bottom: 8px;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="brand-title">
                <!-- โหลดไอคอนจากไฟล์ icon-192.png -->
                <img src="icon-192.png" alt="Logo" class="app-logo" onerror="this.style.display='none'">
                <h1>Homework Tracker</h1>
            </div>
            <p class="subtitle">Intelligent Academic Tracker & Planner</p>
        </header>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="total-count">0</div>
                <div class="stat-label">Total Tasks</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="pending-count">0</div>
                <div class="stat-label">Pending</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="completed-count">0</div>
                <div class="stat-label">Completed</div>
            </div>
        </div>

        <!-- Form -->
        <div class="card">
            <div class="card-title">+ Create New Task</div>
            <form id="task-form">
                <div class="form-group">
                    <label>Task Title / Subject</label>
                    <input type="text" placeholder="e.g. Physics Ch. 5 Problems" required>
                </div>
                <div class="date-row">
                    <div class="form-group">
                        <label>Assigned Date</label>
                        <input type="date">
                    </div>
                    <div class="form-group">
                        <label>Due Date</label>
                        <input type="date">
                    </div>
                </div>
                <button type="submit" class="btn-primary">Save Task</button>
            </form>
        </div>

        <!-- Search & Filters -->
        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" placeholder="Search tasks...">
        </div>

        <div class="filter-tabs">
            <button class="tab active">All</button>
            <button class="tab">Pending</button>
            <button class="tab">Completed</button>
            <button class="tab">Overdue</button>
        </div>

        <!-- Empty List -->
        <div class="empty-state">
            <div class="empty-icon">⚙️</div>
            <p>No tasks found. Add a new task above!</p>
        </div>
    </div>

    <script>
        // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .catch(err => console.log('SW registration failed: ', err));
            });
        }
    </script>
</body>
</html>
